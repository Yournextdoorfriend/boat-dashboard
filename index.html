<style>

button:disabled{opacity:.6}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html){ document.open(); document.write(html); document.close(); }
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(SALT), iterations:ITER}, base, 256));
}
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
f.onsubmit = async e => {
  e.preventDefault(); go.disabled = true; msg.textContent = ""; go.textContent = "Unlocking…";
  try {
    const raw = await derive(document.getElementById("pw").value);
    const html = await unlock(raw);
    if (document.getElementById("rem").checked) store.set(KEYNAME, btoa(String.fromCharCode(...raw)));
    show(html);
  } catch(err) { msg.textContent = "Wrong password"; go.disabled = false; go.textContent = "Open"; }
};
(async () => {
  const saved = store.get(KEYNAME);
  if (saved) { try { show(await unlock(b64(saved))); return; } catch(e) { store.del(KEYNAME); } }
  f.hidden = false; document.getElementById("pw").focus();
})();
})();
